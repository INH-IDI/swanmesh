[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swanmesh"
version = "0.1.0"
description = "SWAN unstructured 2D mesh generator and converter using Gmsh"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Antigravity Team", email = "info@example.com"}
]
dependencies = [
    "numpy>=1.22.0,<2.0.0",
    "scipy>=1.8.0",
    "pandas>=1.4.0",
    "geopandas>=0.10.0",
    "shapely>=2.0.0",
    "pyproj>=3.3.0",
    "rasterio>=1.3.0",
    "matplotlib>=3.5.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "typer>=0.9.0",
    "gmsh>=4.11.0",
]

[project.optional-dependencies]
gui = [
    "FreeSimpleGUI>=5.0.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
swanmesh = "swanmesh.cli:app"
swanmesh-gui = "swanmesh_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py310"
