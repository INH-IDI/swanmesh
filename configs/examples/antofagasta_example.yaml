# swanmesh Antofagasta configuration example
project_name: antofagasta_swan_mesh
output_dir: ./output/antofagasta
overwrite: true

work_crs: "EPSG:4326"
output_crs: "EPSG:4326"
is_utm: false

z_convention: "elevation_negative_down"

domain_path: "./domain_antofagasta.shp"  # Replace with actual domain shapefile
bathy_xyz_path: "./datos_Bathy_Antofagasta.xyz.csv"

dx: 0.0005
dy: 0.0005
buffer_cells: 20
interp_method: "linear"

hmin: 0.0002
hmax: 0.005
wave_period: 30.0
l_constant: 1.5613
strategy: "product"

depth_limit: -50.0
marker_strategy: "depth_limit"

export_sidecar_tifs: true
export_plots: true
export_msh: true
